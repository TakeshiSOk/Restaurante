    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chaves Burguer · Fast Food · Restaurant · Drink</title>
    <meta name="description" content="Salchipapas especiales, hamburguesas caseras, pizzas artesanales, asados y más en Chaves Burguer." />
    <meta name="theme-color" content="#0C0A09" />

    <!-- Google Fonts: Bebas Neue + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
    <!-- Limpieza inmediata de Service Workers y cachés obsoletos en localhost -->
    <script>
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          });
        }
      }
    </script>
  </head>
  <body class="bg-[#0C0A09] text-brand-cream antialiased min-h-screen selection:bg-brand-red selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
